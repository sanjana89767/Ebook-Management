<section class="vh-100 gradient-custom">
    <div class="container py-5 h-100">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-12 col-md-8 col-lg-6 col-xl-5">
          <div class="card bg-white text-black">
            <div class="card-body p-5 text-center">
  
              <div class="mb-md-5 mt-md-4">
  
                <h2 class="fw-bold mb-2 text-uppercase">Create an account</h2>

                <form [formGroup]="signupform">
                    <mat-form-field appearance="fill" class="w-100 mb-3">
                      <mat-label>Username</mat-label>
                      <input matInput type="username" formControlName="username" placeholder="Enter your username" />
                      <mat-error *ngIf="signupform.get('username')?.hasError('required')">
                        Username is <strong>required</strong>
                      </mat-error>
                      
                    </mat-form-field>

                    <mat-form-field appearance="fill" class="w-100 mb-3">
                        <mat-label>Email</mat-label>
                        <input matInput type="email" formControlName="email" placeholder="Enter your Email" />
                        <mat-error *ngIf="signupform.get('email')?.hasError('required')">
                            Email is <strong>required</strong>
                        </mat-error>
                        <mat-error *ngIf="signupform.get('email')?.hasError('email')">
                          Enter a <strong>valid</strong> email
                        </mat-error>
                      </mat-form-field>
      
                    <mat-form-field appearance="fill" class="w-100 mb-4">
                      <mat-label>Password</mat-label>
                      <input matInput type="password" formControlName="password" placeholder="Enter your password" />
                      <mat-error *ngIf="signupform.get('password')?.hasError('required')">
                        Password is <strong>required</strong>
                      </mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="fill" class="w-100 mb-4">
                        <mat-label>Re-enter your password</mat-label>
                        <input matInput type="reenterpassword" formControlName="reenterpassword" placeholder="Re-enter your password" />
                        <mat-error *ngIf="signupform.get('reenterpassword')?.hasError('required')">
                         Re-enter Password is <strong>required</strong>
                        </mat-error>

                        
                      
                      </mat-form-field>
                      <mat-error *ngIf="
                        signupform.get('reenterpassword')?.touched &&
                        signupform.get('password')?.value !== signupform.get('reenterpassword')?.value
                      ">
                        Passwords do not match!
                      </mat-error>
      
                    <button mat-raised-button color="primary" class="w-100" (click)="Save()">Register</button>
                  </form>
  
             
              </div>
  
              <div>
                <p class="mb-0">Have an account already? <a class="text-black-50 fw-bold" routerLink="" >Sign In</a>
                </p>
              </div>
  
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
