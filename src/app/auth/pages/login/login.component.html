<section class="vh-100 gradient-custom">
  <div class="container py-5 h-100">
    <div class="row d-flex justify-content-center align-items-center h-100">
      <div class="col-12 col-md-8 col-lg-6 col-xl-5">
        <div class="card bg-white text-black">
          <div class="card-body p-5 text-center">

            <div class="mb-md-5 mt-md-4">

              <h2 class="fw-bold mb-2 text-uppercase">Login</h2>
              <p class="text-black-50 mb-5">Please enter your login and password!</p>


              <form [formGroup]="loginForm">
                <mat-form-field appearance="fill" class="w-100 mb-3">
                  <mat-label>Username</mat-label>
                  <input matInput type="username" formControlName="username" placeholder="Enter your username" />
                  <mat-error *ngIf="loginForm.get('username')?.hasError('required')">
                    Username is <strong>required</strong>
                  </mat-error>

                </mat-form-field>

                <mat-form-field appearance="fill" class="w-100 mb-4">
                  <mat-label>Password</mat-label>
                  <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password"
                    placeholder="Enter your password" />

                  <button mat-icon-button type="button" (click)="togglePasswordVisibility()" matSuffix>
                    <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                  </button>

                  <mat-error *ngIf="loginForm.get('password')?.hasError('required')">
                    Password is <strong>required</strong>
                  </mat-error>
                </mat-form-field>


                <button mat-raised-button color="primary" class="w-100" (click)="onLogin()">Sign In</button>
              </form>

            </div>

            <div>
              <p class="mb-0">Don't have an account? <a class="text-black-50 fw-bold" routerLink="/sign-up">Sign Up</a>
              </p>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>
