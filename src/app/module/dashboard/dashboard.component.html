<div class="contact-banner-sec common-banner-sec">
  <div class="container">
    <div class="banner-txt">
      <h1>Free ebooks</h1>
    </div>
  </div>
</div>


<div class="mk-current-opening" id="mk-c-o">
  <div class="container">
    <div class="contact-title">

    </div>

    <div class="col-md-12">

      <div class="input-group mk-d-flex mb-3">
        <input id="search" [(ngModel)]="search" [ngModelOptions]="{ standalone: true }" type="text" class="form-control"
          placeholder="Search for Books" />
        <div class="mk-search-icon-outer">
          <mat-icon aria-hidden="false" aria-label="Example home icon" fontIcon="search"></mat-icon>
        </div>
      </div>

      <div class="container mt-4">
        <div *ngFor="let category of categories">
          <h4 class="mb-3 text-primary">{{ category }}</h4>

          <div class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-3">
            <div class="col" *ngFor="let data of filterBooks(category)">
              <div class="card h-100 shadow-sm">
                <img [src]="data.image" class="card-img-top book-image" alt="Book Image">
                <div class="card-body p-2">
                  <h6 class="card-title mb-1">{{ data.title }}</h6>
                  <p class="text-muted small mb-1">{{ data.author }}</p>
                  <p class="card-text small">
                    {{ data.description | slice:0:35 }}{{ data.description.length > 35 ? '...' : '' }}
                  </p>

                </div>
                <div class="card-footer bg-transparent border-0 p-2">
                  <button class="btn btn-outline-primary btn-sm w-100" (click)="binddetail(data)">
                    <i class="fa fa-eye"></i> Preview
                  </button>
                </div>
              </div>
            </div>
          </div>


          <hr class="my-4">
        </div>
      </div>
